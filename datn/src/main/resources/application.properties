spring.application.name=datn

# Datasource: defaults match docker-compose.yml (local Postgres). Override with env vars for Neon.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/datn}
spring.datasource.username=${DB_USERNAME:datn}
spring.datasource.password=${DB_PASSWORD:datn}

# The schema is owned by Flyway migrations (src/main/resources/db/migration); Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Access tokens are signed HS256 JWTs. JWT_SECRET must be at least 32 bytes; when empty a random secret is
# generated at startup (fine for development, but tokens stop working after every restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=8h

# Optional bootstrap admin account, created at startup only when both values are set.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=Administrator

# Groq chatbot (Module B4). Keep both keys in the local .env; never commit them.
app.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
app.ai.groq.primary-key=${GROQ_API_KEY:}
app.ai.groq.backup-key=${GROQ_BACKUP_API_KEY:}
app.ai.groq.connect-timeout=5s
app.ai.groq.read-timeout=12s
